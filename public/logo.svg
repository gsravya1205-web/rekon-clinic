<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <!-- Left Emblem: Stylized Orthopedic / Medical Care Figure -->
  <g transform="translate(10, 8)">
    <!-- Outer Cyan Crescent -->
    <path d="M 40 85 C 20 85 8 68 8 48 C 8 28 24 12 48 10 C 32 18 22 32 22 48 C 22 66 34 78 52 78 C 65 78 76 72 82 62 C 76 76 60 85 40 85 Z" fill="#00A8B5" />
    
    <!-- Dynamic Human Body Swirl in Royal Blue -->
    <path d="M 50 14 C 42 22 34 38 34 54 C 34 74 46 88 64 94 C 54 88 48 76 48 60 C 48 44 54 30 62 20 Z" fill="#1E3A8A" />
    
    <!-- Right Swoosh Arc -->
    <path d="M 64 24 C 74 34 80 48 80 62 C 80 74 74 84 66 90 C 78 84 86 70 86 54 C 86 38 78 24 64 14 Z" fill="#00A8B5" />
    
    <!-- Head Circle -->
    <circle cx="56" cy="12" r="9" fill="#00A8B5" />
    
    <!-- Body Dynamic Ribbon -->
    <path d="M 46 36 Q 58 48 70 34 Q 60 62 48 76 Q 52 56 46 36 Z" fill="#1E3A8A" />
  </g>

  <!-- Right Text Brand Block -->
  <!-- Upper Blue Bar: REKON CLINIC -->
  <rect x="135" y="26" width="330" height="46" rx="4" fill="#1E3A8A" />
  <text x="300" y="59" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2" text-anchor="middle">
    REKON CLINIC
  </text>

  <!-- Lower Cyan Bar: ORTHO & JOINT REPLACEMENT -->
  <rect x="140" y="76" width="320" height="28" rx="3" fill="#00A8B5" />
  <text x="300" y="95" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5" text-anchor="middle">
    ORTHO &amp; JOINT REPLACEMENT
  </text>
</svg>
